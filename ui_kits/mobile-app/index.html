<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토마토 — Mobile App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-kr);
    background: #EEF0F3;
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 16px;
  }
  /* device */
  .device {
    width: 393px; height: 852px; flex: none;
    background: #fff; border-radius: 52px;
    box-shadow: 0 0 0 12px #111827, 0 0 0 14px #2b3344, 0 40px 80px -20px rgba(0,0,0,0.45);
    position: relative; overflow: hidden;
  }
  .screen { position: absolute; inset: 0; border-radius: 40px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  /* notch */
  .notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 34px; background: #111827; border-radius: 18px; z-index: 60; }
  /* status bar */
  .statusbar { height: 54px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); z-index: 40; }
  .statusbar .right { display: flex; gap: 7px; align-items: center; }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .scroll::-webkit-scrollbar { width: 0; }
  /* home indicator */
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #111827; opacity: .85; z-index: 70; }
  .hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 12px; color: var(--gray-500); background: #fff; padding: 7px 14px; border-radius: 999px; box-shadow: var(--shadow-toast); }
  .hint b { color: var(--tomato-500); }
</style>
</head>
<body>
  <div class="device">
    <div class="notch"></div>
    <div id="root" class="screen"></div>
    <div class="home-ind"></div>
  </div>
  <div class="hint">탭 해보세요 · <b>마이크 FAB</b>로 통화 분석을 시작하세요</div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="Analyzing.jsx"></script>
  <script type="text/babel" src="Report.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
