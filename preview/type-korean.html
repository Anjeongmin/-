<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-kr); background: var(--white); color: var(--ink); }
  .card { padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--gray-100); padding-bottom: 12px; }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .meta { font-family: var(--font-display); font-size: 11px; color: var(--gray-400); letter-spacing: 0.04em; width: 130px; flex: none; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="meta">H3 · 700 / 16</span>
      <span style="font-family:var(--font-kr); font-weight:700; font-size:16px;">감정 변화 하이라이트</span>
    </div>
    <div class="row">
      <span class="meta">Body · 400 / 15</span>
      <span style="font-family:var(--font-kr); font-weight:400; font-size:15px; line-height:1.6; color:var(--gray-700);">대안 제시 이후 고객의 호흡이 안정되고 어조가 부드러워졌습니다.</span>
    </div>
    <div class="row">
      <span class="meta">Small · 400 / 14</span>
      <span style="font-family:var(--font-kr); font-weight:400; font-size:14px; color:var(--gray-600);">맞춤형 연습 제안 · 외 124명이 연습 중</span>
    </div>
    <div class="row">
      <span class="meta">Caption · 400 / 12</span>
      <span style="font-family:var(--font-kr); font-weight:400; font-size:12px; color:var(--gray-400);">잠시만 기다려 주세요 · 00:00 – 02:45</span>
    </div>
    <div class="row">
      <span class="meta">Pretendard / Noto KR</span>
      <span style="font-family:var(--font-kr); font-size:15px; color:var(--gray-700);">친절함 차분함 불안함 — 가나다라 0123456789</span>
    </div>
  </div>
</body>
</html>
