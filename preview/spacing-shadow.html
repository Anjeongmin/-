<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-kr); background: var(--white); color: var(--ink); }
  .card { padding: 30px 32px; display:flex; gap:30px; align-items:center; }
  .demo { display:flex; flex-direction:column; gap:9px; align-items:center; }
  .box { width: 150px; height: 76px; background: var(--white); border-radius: 14px; }
  .lab { font-family: var(--font-display); font-size:11px; color:var(--gray-500); text-align:center; }
  .lab b { display:block; color:var(--ink); font-size:12px; margin-bottom:2px; }
  code { font-family: ui-monospace, monospace; font-size:10px; color:var(--gray-400); }
</style>
</head>
<body>
  <div class="card">
    <div class="demo">
      <div class="box" style="box-shadow:var(--shadow-toast)"></div>
      <span class="lab"><b>shadow-toast</b><code>0 2px 4px /.10</code></span>
    </div>
    <div class="demo">
      <div class="box" style="box-shadow:var(--shadow-card)"></div>
      <span class="lab"><b>shadow-card</b><code>0 10px 15px -3px · 0 4px 6px -4px</code></span>
    </div>
    <div class="demo">
      <div class="box" style="background:var(--tomato-500); box-shadow:var(--shadow-pop)"></div>
      <span class="lab"><b>on brand fill</b><code>same as card</code></span>
    </div>
    <div style="margin-left:8px; max-width:150px; font-size:12px; color:var(--gray-500); line-height:1.6;">
      Two elevation levels only. Soft, low-opacity, <b style="color:var(--ink)">neutral</b> — never colored.
    </div>
  </div>
</body>
</html>
