<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--white); color: var(--ink); }
  .card { padding: 26px 30px; display:flex; gap:38px; align-items:flex-start; }
  .col { display:flex; flex-direction:column; gap:14px; }
  .gtitle { font-size:11px; font-weight:600; letter-spacing:0.04em; color:var(--gray-400); text-transform:uppercase; }
  .radii { display:flex; flex-direction:column; gap:11px; }
  .rrow { display:flex; align-items:center; gap:12px; }
  .box { width:46px; height:46px; background:var(--tomato-50); border:1.5px solid var(--tomato-300); flex:none; }
  .rl { font-size:11.5px; color:var(--gray-600); }
  .rl b { color:var(--ink); font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <div class="col">
      <span class="gtitle">Radii</span>
      <div class="radii">
        <div class="rrow"><span class="box" style="border-radius:2px"></span><span class="rl"><b>2</b> · xs · checkbox</span></div>
        <div class="rrow"><span class="box" style="border-radius:4px"></span><span class="rl"><b>4</b> · sm · buttons / inputs / tags</span></div>
        <div class="rrow"><span class="box" style="border-radius:12px"></span><span class="rl"><b>12</b> · md · highlight cards</span></div>
        <div class="rrow"><span class="box" style="border-radius:16px"></span><span class="rl"><b>16</b> · lg · feature cards</span></div>
      </div>
    </div>
    <div class="col">
      <span class="gtitle">&nbsp;</span>
      <div class="radii">
        <div class="rrow"><span class="box" style="border-radius:20px"></span><span class="rl"><b>20</b> · xl · large surfaces</span></div>
        <div class="rrow"><span class="box" style="border-radius:24px"></span><span class="rl"><b>24</b> · 2xl · hero cards</span></div>
        <div class="rrow"><span class="box" style="border-radius:9999px"></span><span class="rl"><b>full</b> · pills / FAB / avatar</span></div>
      </div>
    </div>
    <div class="col">
      <span class="gtitle">Spacing · 4px base</span>
      <div style="display:flex; align-items:flex-end; gap:6px; height:46px;">
        <div style="width:4px; height:4px; background:var(--tomato-400)"></div>
        <div style="width:8px; height:8px; background:var(--tomato-400)"></div>
        <div style="width:12px; height:12px; background:var(--tomato-400)"></div>
        <div style="width:16px; height:16px; background:var(--tomato-400)"></div>
        <div style="width:20px; height:20px; background:var(--tomato-400)"></div>
        <div style="width:24px; height:24px; background:var(--tomato-400)"></div>
        <div style="width:32px; height:32px; background:var(--tomato-400)"></div>
      </div>
      <span class="rl">4 · 8 · 12 · 16 · 20 · 24 · 32 · 40</span>
    </div>
  </div>
</body>
</html>
