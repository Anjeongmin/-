<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--white); color: var(--ink); }
  .card { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--gray-100); padding-bottom: 14px; }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .meta { font-family: var(--font-display); font-size: 11px; color: var(--gray-400); letter-spacing: 0.04em; width: 130px; flex: none; text-transform: uppercase; }
  .spec { font-family: "Inter"; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="meta">Display · 800</span>
      <span class="spec" style="font-weight:800; font-size:28px; letter-spacing:-0.02em;">4.2h · 70%</span>
    </div>
    <div class="row">
      <span class="meta">H1 · 700 / 20</span>
      <span class="spec" style="font-weight:700; font-size:20px;">AI 종합 리포트</span>
    </div>
    <div class="row">
      <span class="meta">H2 · 700 / 18</span>
      <span class="spec" style="font-weight:700; font-size:18px;">분석 결과</span>
    </div>
    <div class="row">
      <span class="meta">Label · 600 / 12</span>
      <span class="spec" style="font-weight:600; font-size:12px; letter-spacing:0.04em;">WELCOME BACK · TOTAL CALLS</span>
    </div>
    <div class="row">
      <span class="meta">Nav · 500 / 10</span>
      <span class="spec" style="font-weight:500; font-size:10px; letter-spacing:0.02em;">HOME · INSIGHTS · SETTINGS</span>
    </div>
  </div>
</body>
</html>
