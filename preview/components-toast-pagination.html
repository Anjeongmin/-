<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-kr); background: var(--white); color: var(--ink); }
  .card { padding: 26px 30px; display:flex; flex-direction:column; gap:18px; }
  .lab { font-family: var(--font-display); font-size:11px; font-weight:600; letter-spacing:0.04em; color:var(--gray-400); text-transform:uppercase; margin-bottom:8px; }
  .toast { width:440px; height:52px; border-radius:var(--radius-sm); background:var(--mint-500); box-shadow:var(--shadow-toast); display:flex; align-items:center; gap:12px; padding:0 18px; color:#fff; font-weight:500; font-size:15px; }
  .toast .ic { width:22px; height:22px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .pag { display:flex; align-items:center; gap:10px; }
  .pg { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:14px; color:var(--gray-500); }
  .pg.on { background:var(--tomato-500); color:#fff; font-weight:700; }
  .pg.nav { color:var(--gray-400); }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="lab">Toast · success</div>
      <div class="toast"><span class="ic">✓</span> 저장 처리 되었습니다.</div>
    </div>
    <div>
      <div class="lab">Pagination</div>
      <div class="pag">
        <span class="pg nav">‹</span>
        <span class="pg on">1</span>
        <span class="pg">2</span>
        <span class="pg">3</span>
        <span class="pg">4</span>
        <span class="pg">5</span>
        <span class="pg nav" style="color:var(--black)">›</span>
      </div>
    </div>
  </div>
</body>
</html>
